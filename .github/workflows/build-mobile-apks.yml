name: Build CivicPulse Mobile APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [citizen, authority]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile/${{ matrix.app }}
        run: npm install

      - name: Generate Android project
        working-directory: mobile/${{ matrix.app }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Add location permissions (Citizen app only)
        if: matrix.app == 'citizen'
        working-directory: mobile/citizen
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = ('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
                   '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n')
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", perms + "\n    <application", 1)
              p.write_text(s)
          print("Manifest patched" if "ACCESS_FINE_LOCATION" in p.read_text() else "PATCH FAILED")
          PY

      - name: Build debug APK
        working-directory: mobile/${{ matrix.app }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CivicPulse-${{ matrix.app }}-apk
          path: mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
